<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        
        <!-- Bootstrap CSS -->
        
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
        
        <!-- My CSS -->
        
        <link rel="stylesheet" href="style.css" />
        
        <!-- Font Awesome -->
        
        <script src="https://kit.fontawesome.com/996973c893.js">

        </script>
        
        <!-- Google Fonts -->
        
        <link
            href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap"
            rel="stylesheet" />
            <title>simple calculator</title>
            <style>
                body{
                    font-family: 'open sans',sans-serif;
                    background-color: black;
                }
                #container{
                    width: 1000px;
                    height: 550px;
                    background-image:linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)), url(bgImg.jpg); ;
                    margin: 20px auto;
                }
                #calculator{
                    width:320px ;
                    height: 520px;
                    background-color:#eaedef ;
                    margin:0 auto ;
                    position: relative;
                    border-radius:5px ;
                    box-shadow:4px 5px 0 rgba(0,0,0,0.2), 6px 20px 0 rgba(0,0,0,0.19) ;
                    top: 20px;
                }
                #result{
                    height: 120px;
                }
                #keyboard{
                    height: 400px;
                }
                .operator,.number,.empty{
                    width: 50px;
                    height: 50px;
                    margin: 15px;
                    float: left;
                    border-radius:50% ;
                    border-width: 0;
                    font-weight: bold;
                    font-size:15px ;
                }
                .number,.empty{
                    background-color: #eaedef;
                }
                .number,.operator{
                    cursor: pointer;
                }
                .operator.active, .number.active{
                    font-size: 13px;
                }
                .operator:focus,.number:focus, .empty:focus{
                    outline: 0;
                }
                button:nth-child(4){
                    font-size: 20px;
                    background-color: #2eb2aa;
                }
                button:nth-child(8){
font-size: 20px;
background-color: blue;
                }
                button:nth-child(12){
font-size: 20px;
background-color: red;
                } 
                button:nth-child(16){
                    font-size: 20px;
                    background-color: purple;
                }
                button:nth-child(20){
                    background-color: yellow;
                }
            </style>
    </head>
    <body>
        <div id="calculator">
            <div id="result">
                <div id="history">
                    <p id="history value"></p>
                </div>
                <div id="output">
                    <p id="output value"></p>
                </div>
            </div>
            <div id="keyboard">
                <button class="operator" id="clear">c</button>
                    <button class="operator" id="backspace">CE</button>
                    <button class="operator" id="%">%</button>
                    <button class="operator" id="/">/</button>
                    <button class="operator" id="7">7</button>
                    <button class="operator" id="8">8</button>
                    <button class="operator" id="9">9</button>
                    <button class="operator" id="*">*</button>
                    <button class="operator" id="4">4</button>
                    <button class="operator" id="5">5</button>
                    <button class="operator" id="6">6</button>
                    <button class="operator" id="-">-</button>
                    <button class="operator" id="1">1</button>
                    <button class="operator" id="2">2</button>
                    <button class="operator" id="3">3</button>
                    <button class="operator" id="+">+</button>
                    <button class="empty" id="empty"></button>
                    <button class="number" id="0"></button>
                    <button class="empty" id="empty"></button>
                    <button class="operator" id="=">=</button>
            </div>
        </div>
    </div>
    </body>
</html>+
